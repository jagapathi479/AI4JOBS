<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI4Jobs - Fake Job Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🧠 AI4Jobs: Fake Job Detection System</h1>
        <p>Welcome, {{ current_user.username }}! <a href="{{ url_for('logout') }}">Logout</a></p>
        <form action="/predict" method="POST">
            <textarea name="jobdesc" rows="10" cols="80" placeholder="Enter job description here..."></textarea><br>
            <select name="model">
                {% for model in models %}
                <option value="{{ model }}">{{ model }}</option>
                {% endfor %}
            </select>
            <button type="submit">Predict</button>
        </form>
        {% if prediction %}
            <h2>Result: {{ prediction }}</h2>
        {% endif %}
    </div>
</body>
</html>
